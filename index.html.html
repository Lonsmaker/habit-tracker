<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --card-bg: rgba(35, 38, 50, 0.85);
  --card-border: rgba(255,255,255,0.08);
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #5b9df9;
  --done-bg: rgba(91, 157, 249, 0.15);
  --danger: #e74c3c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  color: var(--text);
  min-height: 100vh;
  transition: background 0.6s ease;
  padding: 20px;
}
body.theme-dark {
  background: radial-gradient(ellipse at 20% 0%, #1e2438 0%, #121525 40%, #0a0c14 100%);
}
body.theme-sea {
  background: linear-gradient(180deg, #0a3d62 0%, #0c5477 30%, #1a8faf 65%, #2ec4ea 100%);
}
body.theme-sunset {
  background: linear-gradient(180deg, #1a0a2e 0%, #3d1e5b 20%, #b8336a 55%, #e8616b 80%, #f0a35e 100%);
}
body.theme-forest {
  background: linear-gradient(180deg, #0a1f12 0%, #14301e 30%, #1e4a30 60%, #2d6a40 100%);
}
body.theme-dark::before {
  content: '';
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: radial-gradient(circle at 70% 20%, rgba(91,157,249,0.06) 0%, transparent 40%),
              radial-gradient(circle at 20% 80%, rgba(255,100,150,0.04) 0%, transparent 40%);
  pointer-events: none; z-index: 0;
}
body.theme-sea::before {
  content: '';
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 30%);
  pointer-events: none; z-index: 0;
}
body.theme-sunset::before {
  content: '';
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: radial-gradient(circle at 80% 20%, rgba(255,200,100,0.15) 0%, transparent 35%);
  pointer-events: none; z-index: 0;
}
body.theme-forest::before {
  content: '';
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: repeating-linear-gradient(90deg, transparent 0px, transparent 80px, rgba(255,255,255,0.015) 80px, rgba(255,255,255,0.015) 82px);
  pointer-events: none; z-index: 0;
}
.container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

/* Theme buttons */
.theme-bar {
  position: fixed; top: 16px; right: 16px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(35,38,50,0.7); backdrop-filter: blur(10px);
  padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  z-index: 50; margin-bottom: 0;
}
.theme-bar-label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
.theme-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all 0.3s; flex-shrink: 0;
}
.theme-btn.active { border-color: #fff; transform: scale(1.1); }
.theme-btn[data-theme="dark"] { background: linear-gradient(135deg, #1e2438, #0a0c14); }
.theme-btn[data-theme="sea"] { background: linear-gradient(135deg, #0a3d62, #2ec4ea); }
.theme-btn[data-theme="sunset"] { background: linear-gradient(135deg, #3d1e5b, #f0a35e); }
.theme-btn[data-theme="forest"] { background: linear-gradient(135deg, #14301e, #2d6a40); }

/* Summary */
.summary-box {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  backdrop-filter: blur(8px);
}
.summary-emoji { font-size: 32px; margin-bottom: 8px; }
.summary-text { font-size: 16px; line-height: 1.4; }
.summary-stats { display: flex; gap: 20px; margin-top: 10px; }
.summary-stat { font-size: 13px; color: var(--text-dim); }
.summary-stat b { color: var(--text); font-size: 16px; }
.summary-all-done { animation: glow 1.5s ease-in-out infinite; }
@keyframes glow {
  0%,100% { box-shadow: 0 0 5px rgba(91,157,249,0.2); }
  50% { box-shadow: 0 0 20px rgba(91,157,249,0.5); }
}

/* Stats panel */
.stats-panel {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 16px 20px; margin-bottom: 16px;
  backdrop-filter: blur(8px);
}
.stats-panel h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.stats-grid { display: flex; gap: 16px; flex-wrap: wrap; }
.stats-item { font-size: 13px; color: var(--text-dim); }
.stats-item b { color: var(--text); font-size: 18px; display: block; }

/* Add form */
.add-form { display: flex; gap: 8px; margin-bottom: 16px; position: relative; }
.add-form input {
  flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--card-border);
  background: var(--card-bg); color: var(--text); font-size: 15px;
  backdrop-filter: blur(8px);
}
.add-form input:focus { outline: none; border-color: var(--accent); }
.add-form button {
  padding: 12px 20px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; font-size: 15px;
  cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
}
.add-form button:hover { opacity: 0.85; }

/* Autocomplete */
.autocomplete-list {
  position: absolute; top: 100%; left: 0; right: 52px;
  background: rgba(30,33,48,0.97); border: 1px solid var(--card-border);
  border-radius: 10px; max-height: 280px; overflow-y: auto; z-index: 100;
  display: none; backdrop-filter: blur(10px);
}
.autocomplete-list.show { display: block; }
.autocomplete-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  cursor: pointer; transition: background 0.15s;
}
.autocomplete-item:hover, .autocomplete-item.active { background: rgba(91,157,249,0.15); }
.autocomplete-item .ac-icon { font-size: 20px; }
.autocomplete-item .ac-name { flex: 1; }
.autocomplete-item .ac-cat { font-size: 12px; color: var(--text-dim); }

/* Controls */
.controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.controls input {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
  background: var(--card-bg); color: var(--text); font-size: 14px; flex: 1; min-width: 120px;
}
.controls input:focus { outline: none; border-color: var(--accent); }
.controls select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
  background: var(--card-bg); color: var(--text); font-size: 14px; cursor: pointer;
}
.controls select option { background: #1e2438; color: var(--text); }
.btn-clear {
  padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(231,76,60,0.4);
  background: rgba(231,76,60,0.12); color: #e74c3c; font-size: 14px; cursor: pointer;
  transition: background 0.2s;
}
.btn-clear:hover { background: rgba(231,76,60,0.25); }

/* Habit list */
#habits-list { display: flex; flex-direction: column; gap: 10px; }
.habit-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(8px);
  transition: opacity 0.3s, transform 0.2s;
  cursor: grab;
}
.habit-card.dragging { opacity: 0.4; cursor: grabbing; }
.habit-card.drag-over { transform: translateY(4px); box-shadow: 0 -3px 0 var(--accent); }
.habit-card.archived { opacity: 0.4; }
.habit-card.inactive-day { opacity: 0.55; }
.habit-card.done-today { border-color: rgba(91,157,249,0.3); }
.habit-card.removing { animation: removeCard 0.3s forwards; }
@keyframes removeCard { to { opacity: 0; transform: translateX(40px); } }

.habit-top { display: flex; align-items: center; gap: 10px; }
.habit-icon { font-size: 22px; flex-shrink: 0; }
.habit-name { flex: 1; font-size: 15px; font-weight: 500; }
.habit-count { font-size: 14px; color: var(--accent); font-weight: 600; }
.habit-streak { font-size: 13px; color: #e89a3c; white-space: nowrap; }

.habit-days { display: flex; gap: 4px; margin-top: 8px; font-size: 11px; }
.habit-day { padding: 2px 6px; border-radius: 4px; color: var(--text-dim); }
.habit-day.active { color: var(--accent); font-weight: 600; }
.habit-day.today { border: 1px solid var(--accent); }

.habit-week {
  display: flex; gap: 3px; margin-top: 10px; align-items: flex-end; height: 40px;
}
.week-bar {
  flex: 1; border-radius: 3px 3px 0 0; min-height: 4px;
  background: rgba(255,255,255,0.08); transition: height 0.4s, background 0.3s;
  position: relative;
}
.week-bar.filled { background: var(--accent); }
.week-bar.today { box-shadow: 0 0 6px rgba(91,157,249,0.5); }
.week-bar .day-label {
  position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--text-dim);
}
.week-bar.today .day-label { color: var(--accent); font-weight: 700; }

.habit-actions { display: flex; gap: 6px; margin-top: 28px; }
.habit-actions button {
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.05); color: var(--text); font-size: 13px;
  cursor: pointer; transition: all 0.2s;
}
.habit-actions button:hover { background: rgba(255,255,255,0.12); }
.habit-actions .btn-done { color: var(--accent); border-color: rgba(91,157,249,0.3); }
.habit-actions .btn-done:hover { background: var(--done-bg); }
.habit-actions .btn-reset:hover { background: rgba(255,200,100,0.12); }
.habit-actions .btn-delete:hover { background: rgba(231,76,60,0.12); color: var(--danger); }
.habit-actions .btn-edit:hover { background: rgba(255,255,255,0.12); }
.habit-actions .btn-archive:hover { background: rgba(255,255,255,0.12); }

/* Tooltips for icon-only buttons */
.habit-actions button { position: relative; }
.habit-actions button[data-action="edit"]::after,
.habit-actions button[data-action="delete"]::after,
.habit-actions button[data-action="archive"]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 100;
}
.habit-actions button[data-action="edit"]:hover::after,
.habit-actions button[data-action="delete"]:hover::after,
.habit-actions button[data-action="archive"]:hover::after {
  opacity: 1;
}

/* History */
.history-section {
  margin-top: 20px; background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 16px 20px; backdrop-filter: blur(8px);
}
.history-section h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.history-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.history-toggle {
  background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
  border-radius: 10px; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--text); cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.history-toggle:hover { background: rgba(255,255,255,0.15); }
.history-toggle.collapsed { transform: rotate(-90deg); }
.history-content { overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 300px; }
.history-content.collapsed { max-height: 0; opacity: 0; }
.history-list { max-height: 240px; overflow-y: auto; }
.history-item { padding: 6px 0; font-size: 13px; color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.04); }
.history-item:last-child { border-bottom: none; }
.history-item .h-time { color: var(--accent); margin-right: 6px; }

.empty-msg { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 15px; }

/* Modal */
.modal-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #232638; border: 1px solid var(--card-border); border-radius: 16px;
  padding: 24px; width: 90%; max-width: 400px;
}
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal input, .modal select {
  width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.05); color: var(--text); font-size: 15px; margin-bottom: 12px;
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
.modal select option { background: #232638; }
.modal-days { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.modal-day {
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.05); color: var(--text-dim); cursor: pointer;
  font-size: 13px; transition: all 0.2s;
}
.modal-day.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-actions button {
  padding: 8px 18px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer;
}
.modal-actions .btn-save { background: var(--accent); color: #fff; }
.modal-actions .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text); }

/* View toggle */
.view-toggle { display: flex; gap: 4px; margin-bottom: 16px; }
.view-toggle button {
  padding: 6px 16px; border-radius: 8px; border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: 13px;
  cursor: pointer; transition: all 0.2s;
}
.view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body class="theme-dark">
<div class="container">
  <div class="theme-bar">
    <span class="theme-bar-label">Смена фона</span>
    <button class="theme-btn active" data-theme="dark" title="Тёмная"></button>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Редактировать привычку</h3>

      <button class="btn-cancel" id="modal-cancel">Отмена</button>
      <button class="btn-save" id="modal-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ─── Data ───
const SUGGESTIONS = [
  {icon:"💧",name:"Выпить воды",cat:"Здоровье"},
  {icon:"📚",name:"Прочитать книгу",cat:"Образование"},
  {icon:"🏃",name:"Сходить на тренировку",cat:"Спорт"},
  {icon:"🧘",name:"Помедитировать",cat:"Здоровье"},
  {icon:"🚶",name:"Прогулка 30 минут",cat:"Здоровье"},
  {icon:"🥗",name:"Здоровый обед",cat:"Питание"},
  {icon:"😴",name:"Лечь спать до 23:00",cat:"Здоровье"},
  {icon:"✍️",name:"Вести дневник",cat:"Творчество"},
  {icon:"🎯",name:"Поставить цели на день",cat:"Продуктивность"},
  {icon:"🧹",name:"Убраться в комнате",cat:"Быт"},
  {icon:"💻",name:"Поработать над проектом",cat:"Работа"},
  {icon:"🎸",name:"Практика на гитаре",cat:"Творчество"},
  {icon:"🦷",name:"Почистить зубы нитью",cat:"Здоровье"},
  {icon:"☀️",name:"Встать до 8:00",cat:"Продуктивность"},
  {icon:"📵",name:"Меньше часа в соцсетях",cat:"Продуктивность"},
  {icon:"💧",name:"Принять витамины",cat:"Здоровье"},
  {icon:"📝",name:"Изучить 10 слов",cat:"Образование"},
  {icon:"🚴",name:"Поездка на велосипеде",cat:"Спорт"},
  {icon:"🍎",name:"Съесть фрукт",cat:"Питание"},
  {icon:"📐",name:"Решить задачу по математике",cat:"Образование"}
];
const CATEGORIES = ["Здоровье","Образование","Спорт","Питание","Быт","Творчество","Работа","Продуктивность"];
const DAY_NAMES = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const DAY_FULL = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

let habits = [];
let history = [];
let currentView = "active";
let currentSort = "manual";
let editingId = null;

// ─── Persistence ───
function load() {
  try {
    habits = JSON.parse(localStorage.getItem("tracker-habits") || "[]");
    history = JSON.parse(localStorage.getItem("tracker-history") || "[]");
    const theme = localStorage.getItem("tracker-theme") || "dark";
    setTheme(theme);
  } catch(e) { habits = []; history = []; }
}
function save() {
  localStorage.setItem("tracker-habits", JSON.stringify(habits));
  localStorage.setItem("tracker-history", JSON.stringify(history));
}
function todayKey() { return new Date().toISOString().slice(0,10); }
function todayDow() { return new Date().getDay(); }
function esc(s) { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// ─── Theme ───
function setTheme(t) {
  document.body.className = "theme-" + t;
  document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.theme === t));
  localStorage.setItem("tracker-theme", t);
}

// ─── Streak calc ───
function calcStreak(h) {
  if (!h.weekLog) return 0;
  let streak = 0;
  let d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = d.toISOString().slice(0,10);
    if (h.weekLog[key] && h.weekLog[key] > 0) {
      streak++;
    } else if (i > 0) {
      break;
    }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ─── Pluralize ───
function plural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

// ─── Render Summary ───
function renderSummary() {
  const active = habits.filter(h => !h.archived);
  const today = todayKey();
  const doneToday = active.filter(h => (h.counts && h.counts[today]) || 0).length;
  const total = active.length;
  const emojiEl = document.getElementById("summary-emoji");
  const textEl = document.getElementById("summary-text");
  const statsEl = document.getElementById("summary-stats");
  const box = document.getElementById("summary-box");

  box.classList.remove("summary-all-done");

  if (total === 0) {
    emojiEl.textContent = "📋";
    textEl.textContent = "Добавьте первую привычку, чтобы начать отслеживание.";
    statsEl.style.display = "none";
    return;
  }
  statsEl.style.display = "flex";
  document.getElementById("stat-done").textContent = doneToday;
  document.getElementById("stat-total").textContent = total;
  const pct = Math.round(doneToday / total * 100);
  document.getElementById("stat-progress").textContent = pct + "%";

  if (doneToday === 0) {
    emojiEl.textContent = "🌱";
    textEl.textContent = "Пора начинать! " + total + plural(total, " привычка ждёт вас.", " привычки ждут вас.", " привычек ждут вас.");
  } else if (pct < 50) {
    emojiEl.textContent = "🚀";
    textEl.textContent = "Начало положено: " + doneToday + " из " + total + plural(total, " привычки", " привычек", " привычек") + ".";
  } else if (pct < 75) {
    emojiEl.textContent = "⚡";
    textEl.textContent = "Больше половины! Выполнено " + doneToday + " из " + total + ".";
  } else if (pct < 100) {
    emojiEl.textContent = "🔥";
    const left = total - doneToday;
    textEl.textContent = "Почти всё! Осталось всего " + left + plural(left, " привычка", " привычки", " привычек") + ".";
  } else {
    emojiEl.textContent = "🎉";
    textEl.textContent = "Все привычки выполнены! Отличная работа!";
    box.classList.add("summary-all-done");
  }
}

// ─── Render Weekly Stats ───
function renderWeeklyStats() {
  const panel = document.getElementById("stats-panel");
  if (habits.length === 0) { panel.style.display = "none"; return; }
  panel.style.display = "block";

  const dayCounts = [0,0,0,0,0,0,0]; // Sun..Sat
  let totalWeek = 0;
  const now = new Date();
  const start = new Date(now); start.setDate(start.getDate() - 6);

  habits.forEach(h => {
    if (!h.weekLog) return;
    Object.entries(h.weekLog).forEach(([key, val]) => {
      const d = new Date(key);
      if (d >= start && d <= now && val > 0) {
        dayCounts[d.getDay()] += val;
        totalWeek += val;
      }
    });
  });

  let bestDay = "—", bestVal = 0;
  for (let i = 0; i < 7; i++) {
    if (dayCounts[i] > bestVal) { bestVal = dayCounts[i]; bestDay = DAY_FULL[i]; }
  }
  document.getElementById("ws-best").textContent = bestVal > 0 ? bestDay : "—";
  document.getElementById("ws-avg").textContent = (totalWeek / 7).toFixed(1);
  document.getElementById("ws-total").textContent = totalWeek;
}

// ─── Render Habits ───
function renderHabits() {
  let list = habits.filter(h => currentView === "active" ? !h.archived : h.archived);
  if (currentSort === "streak") list.sort((a,b) => calcStreak(b) - calcStreak(a));
  else if (currentSort === "az") list.sort((a,b) => a.name.localeCompare(b.name));

  const container = document.getElementById("habits-list");
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-msg">' + (currentView === "active" ? "Активных привычек нет. Добавьте первую!" : "Архив пуст.") + "</div>";
    return;
  }

  const today = todayKey();
  const dow = todayDow();

  container.innerHTML = list.map(h => {
    const count = (h.counts && h.counts[today]) || 0;
    const streak = calcStreak(h);
    const isActiveDay = !h.days || h.days.length === 0 || h.days.includes(dow);
    const isDone = count > 0;

    // Week chart
    let weekHtml = '<div class="habit-week">';
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0,10);
      const val = (h.weekLog && h.weekLog[key]) || 0;
      const isToday = i === 0;
      const h2 = val > 0 ? Math.min(40, 8 + val * 8) : 4;
      const cls = "week-bar " + (val > 0 ? "filled" : "") + (isToday ? " today" : "");
      weekHtml += '<div class="' + cls + '" style="height:' + h2 + 'px;"><span class="day-label">' + DAY_NAMES[d.getDay()] + '</span></div>';
    }
    weekHtml += '</div>';

    // Days
    let daysHtml = '<div class="habit-days">';
    for (let i = 1; i <= 7; i++) {
      const dayIdx = i === 7 ? 0 : i;
      const active = !h.days || h.days.length === 0 || h.days.includes(dayIdx);
      const isToday = dayIdx === dow;
      daysHtml += '<span class="habit-day ' + (active ? "active" : "") + (isToday ? " today" : "") + '">' + DAY_NAMES[dayIdx] + '</span>';
    }
    daysHtml += '</div>';

    return '<div class="habit-card' + (h.archived ? " archived" : "") + (!isActiveDay ? " inactive-day" : "") + (isDone ? " done-today" : "") + '" data-id="' + h.id + '">' +
      '<div class="habit-top">' +
        '<span class="habit-icon">' + (h.icon || "✅") + '</span>' +
        '<span class="habit-name">' + esc(h.name) + '</span>' +
        (count > 0 ? '<span class="habit-count">×' + count + '</span>' : '') +
        (streak > 0 ? '<span class="habit-streak">🔥 ' + streak + '</span>' : '') +
      '</div>' +
      daysHtml +
      weekHtml +
      '<div class="habit-actions">' +
        '<button class="btn-done" data-action="done" data-id="' + h.id + '">✅ Сделано' + (count > 0 ? ' (' + count + ')' : '') + '</button>' +
        '<button class="btn-reset" data-action="reset" data-id="' + h.id + '">🔄 Сброс</button>' +
        '<button class="btn-edit" data-action="edit" data-id="' + h.id + '" data-tooltip="Редактировать">✏️</button>' +
        '<button class="btn-archive" data-action="archive" data-id="' + h.id + '" data-tooltip="' + (h.archived ? "Вернуть из архива" : "В архив") + '">' + (h.archived ? "📤" : "📦") + '</button>' +
        '<button class="btn-delete" data-action="delete" data-id="' + h.id + '" data-tooltip="Удалить">🗑</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

// ─── Render History ───
function renderHistory() {
  const el = document.getElementById("history-list");
  if (history.length === 0) {
    el.innerHTML = '<div class="history-item" style="text-align:center;">Пока пусто</div>';
    return;
  }
  el.innerHTML = history.slice(-50).reverse().map(h =>
    '<div class="history-item"><span class="h-time">' + h.time + '</span>' + esc(h.text) + '</div>'
  ).join("");
}

// ─── Render All ───
function renderAll() {
  renderSummary();
  renderWeeklyStats();
  renderHabits();
  renderHistory();
}

// ─── Actions ───
function addHabit(name, icon, cat) {
  const habit = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, icon: icon || "✅", category: cat || "",
    counts: {}, weekLog: {}, days: [], archived: false, order: habits.length
  };
  habits.push(habit);
  save(); renderAll();
}
function doHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  const today = todayKey();
  if (!h.counts) h.counts = {};
  if (!h.weekLog) h.weekLog = {};
  h.counts[today] = (h.counts[today] || 0) + 1;
  h.weekLog[today] = h.counts[today];
  addHistory("✅ «" + h.name + "» — выполнено (×" + h.counts[today] + ")");
  save(); renderAll();
}
function resetHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  const today = todayKey();
  if (h.counts) delete h.counts[today];
  if (h.weekLog) h.weekLog[today] = 0;
  addHistory("🔄 «" + h.name + "» — сброс за сегодня");
  save(); renderAll();
}
function deleteHabit(id) {
  const card = document.querySelector('.habit-card[data-id="' + id + '"]');
  if (card) {
    card.classList.add("removing");
    setTimeout(() => {
      const h = habits.find(x => x.id === id);
      if (h) addHistory("🗑 «" + h.name + "» — удалена");
      habits = habits.filter(x => x.id !== id);
      save(); renderAll();
    }, 300);
  } else {
    habits = habits.filter(x => x.id !== id);
    save(); renderAll();
  }
}
function archiveHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  h.archived = !h.archived;
  addHistory(h.archived ? "📦 «" + h.name + "» — в архиве" : "📤 «" + h.name + "» — восстановлена");
  save(); renderAll();
}
function clearToday() {
  const today = todayKey();
  let n = 0;
  habits.forEach(h => {
    if (h.counts && h.counts[today]) { n++; delete h.counts[today]; }
    if (h.weekLog) h.weekLog[today] = 0;
  });
  addHistory("🗑 История за сегодня очищена (" + n + plural(n, " запись", " записи", " записей") + ")");
  save(); renderAll();
}
function addHistory(text) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  history.push({ time, text, date: todayKey() });
  if (history.length > 500) history = history.slice(-500);
}

// ─── Modal ───
function openModal(id) {
  editingId = id;
  const h = habits.find(x => x.id === id);
  if (!h) return;
  document.getElementById("modal-icon").value = h.icon || "✅";
  document.getElementById("modal-name").value = h.name;
  const catSel = document.getElementById("modal-category");
  catSel.innerHTML = '<option value="">Без категории</option>' + CATEGORIES.map(c => '<option value="' + c + '"' + (h.category === c ? " selected" : "") + '>' + c + '</option>').join("");

  const daysEl = document.getElementById("modal-days");
  const selectedDays = h.days || [];
  daysEl.innerHTML = "";
  for (let i = 1; i <= 7; i++) {
    const dayIdx = i === 7 ? 0 : i;
    const btn = document.createElement("div");
    btn.className = "modal-day" + (selectedDays.includes(dayIdx) ? " selected" : "");
    btn.textContent = DAY_NAMES[dayIdx];
    btn.dataset.day = dayIdx;
    btn.onclick = () => btn.classList.toggle("selected");
    daysEl.appendChild(btn);
  }
  document.getElementById("modal-overlay").classList.add("show");
}
function closeModal() {
  editingId = null;
  document.getElementById("modal-overlay").classList.remove("show");
}
function saveModal() {
  const h = habits.find(x => x.id === editingId);
  if (!h) return;
  h.icon = document.getElementById("modal-icon").value.trim() || "✅";
  h.name = document.getElementById("modal-name").value.trim() || h.name;
  h.category = document.getElementById("modal-category").value;
  const selected = [];
  document.querySelectorAll("#modal-days .modal-day.selected").forEach(d => selected.push(parseInt(d.dataset.day)));
  h.days = selected;
  save(); closeModal(); renderAll();
}

// ─── Autocomplete ───
let acIndex = -1;
function showAutocomplete(q) {
  const list = document.getElementById("autocomplete");
  const filtered = q ? SUGGESTIONS.filter(s => s.name.toLowerCase().includes(q.toLowerCase())) : SUGGESTIONS;
  if (filtered.length === 0) { list.classList.remove("show"); return; }
  acIndex = -1;
  list.innerHTML = filtered.map((s, i) =>
    '<div class="autocomplete-item" data-icon="' + s.icon + '" data-name="' + s.name + '" data-cat="' + s.cat + '">' +
    '<span class="ac-icon">' + s.icon + '</span><span class="ac-name">' + s.name + '</span><span class="ac-cat">' + s.cat + '</span>' +
    '</div>'
  ).join("");
  list.classList.add("show");
}
function hideAutocomplete() {
  document.getElementById("autocomplete").classList.remove("show");
  acIndex = -1;
}

// ─── Event Listeners ───
document.addEventListener("DOMContentLoaded", () => {
  load();
  renderAll();

  // Theme buttons
  document.querySelectorAll(".theme-btn").forEach(b => {
    b.onclick = () => setTheme(b.dataset.theme);
  });

  // Add habit
  const input = document.getElementById("habit-input");
  const addBtn = document.getElementById("add-btn");

  input.addEventListener("focus", () => { if (justAdded) { justAdded = false; return; } showAutocomplete(input.value); });
  input.addEventListener("input", () => showAutocomplete(input.value));
  input.addEventListener("keydown", (e) => {
    const items = document.querySelectorAll(".autocomplete-item");
    if (e.key === "ArrowDown" && items.length > 0) {
      e.preventDefault();
      acIndex = Math.min(acIndex + 1, items.length - 1);
      items.forEach((it, i) => it.classList.toggle("active", i === acIndex));
    } else if (e.key === "ArrowUp" && items.length > 0) {
      e.preventDefault();
      acIndex = Math.max(acIndex - 1, -1);
      items.forEach((it, i) => it.classList.toggle("active", i === acIndex));
    } else if (e.key === "Enter") {
      if (acIndex >= 0 && items[acIndex]) {
        e.preventDefault();
        const it = items[acIndex];
        addHabit(it.dataset.name, it.dataset.icon, it.dataset.cat);
        input.value = "";
        hideAutocomplete();
      } else {
        const v = input.value.trim();
        if (v) { addHabit(v); input.value = ""; hideAutocomplete(); }
      }
    } else if (e.key === "Escape") {
      hideAutocomplete();
    }
  });

  let justAdded = false;
  addBtn.onclick = () => {
    const v = input.value.trim();
    if (v) { addHabit(v); input.value = ""; hideAutocomplete(); justAdded = true; input.blur(); }
  };

  // Autocomplete click
  document.getElementById("autocomplete").addEventListener("click", (e) => {
    const item = e.target.closest(".autocomplete-item");
    if (item) {
      input.value = item.dataset.name;
      input.dataset.icon = item.dataset.icon;
      input.dataset.cat = item.dataset.cat;
      hideAutocomplete();
    }
  });

  // Search
  document.getElementById("search-input").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll(".habit-card").forEach(card => {
      const h = habits.find(x => x.id === card.dataset.id);
      if (!h) return;
      card.style.display = h.name.toLowerCase().includes(q) ? "" : "none";
    });
  });

  // Sort
  document.getElementById("sort-select").onchange = (e) => {
    currentSort = e.target.value;
    renderHabits();
  };

  // Clear today
  document.getElementById("clear-today-btn").onclick = clearToday;

  // View toggle
  document.querySelectorAll(".view-toggle button").forEach(b => {
    b.onclick = () => {
      currentView = b.dataset.view;
      document.querySelectorAll(".view-toggle button").forEach(x => x.classList.toggle("active", x === b));
      renderHabits();
    };
  });

  // Habits list — event delegation
  document.getElementById("habits-list").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === "done") doHabit(id);
    else if (action === "reset") resetHabit(id);
    else if (action === "delete") deleteHabit(id);
    else if (action === "edit") openModal(id);
    else if (action === "archive") archiveHabit(id);
  });

  // Modal
  document.getElementById("modal-cancel").onclick = closeModal;
  document.getElementById("modal-save").onclick = saveModal;
  document.getElementById("modal-overlay").onclick = (e) => {
    if (e.target === document.getElementById("modal-overlay")) closeModal();
  };

  // Close autocomplete on outside click
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".add-form")) hideAutocomplete();
  });

  // History collapse toggle
  const historyToggle = document.getElementById("history-toggle");
  const historyContent = document.getElementById("history-content");
  document.getElementById("history-header").addEventListener("click", () => {
    historyToggle.classList.toggle("collapsed");
    historyContent.classList.toggle("collapsed");
  });

  // ─── Drag & Drop ───
  let dragId = null;
  const listEl = document.getElementById("habits-list");
  listEl.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".habit-card");
    if (!card) return;
    dragId = card.dataset.id;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  listEl.addEventListener("dragend", (e) => {
    const card = e.target.closest(".habit-card");
    if (card) card.classList.remove("dragging");
    document.querySelectorAll(".habit-card").forEach(c => c.classList.remove("drag-over"));
    dragId = null;
  });
  listEl.addEventListener("dragover", (e) => {
    e.preventDefault();
    const card = e.target.closest(".habit-card");
    if (card && card.dataset.id !== dragId) {
      document.querySelectorAll(".habit-card").forEach(c => c.classList.remove("drag-over"));
      card.classList.add("drag-over");
    }
  });
  listEl.addEventListener("drop", (e) => {
    e.preventDefault();
    const targetCard = e.target.closest(".habit-card");
    if (!targetCard || !dragId) return;
    const targetId = targetCard.dataset.id;
    if (targetId === dragId) return;
    const dragIdx = habits.findIndex(h => h.id === dragId);
    const targetIdx = habits.findIndex(h => h.id === targetId);
    if (dragIdx < 0 || targetIdx < 0) return;
    const [moved] = habits.splice(dragIdx, 1);
    habits.splice(targetIdx, 0, moved);
    save(); renderHabits();
  });
});
</script>
</body>
